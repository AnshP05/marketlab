<h1>Accounts</h1>
<button id="load-accounts" type="button">Load Accounts</button>
<p id="status">Accounts have not been loaded yet.</p>
<ul id="accounts-list"></ul>
<script>
    // Async bc it is a network request so it returns a promise that it will deliver smtjh
    async function loadAccounts() {
        const element = document.getElementById("status");
        element.textContent = "Loading";
        const response = await fetch("api/v1/accounts");
        const data = await response.json();
        data_string = JSON.stringify(data);
        let names = "";
        for (let i = 0; i < data.accounts.length; ++i){
            names += data.accounts[i].name + ", ";
        }
        element.textContent = names;
    }

    document.getElementById("load-accounts").addEventListener("click", loadAccounts)
</script>

<button id="open-holding">Open Hodling</button>
<p id="open-holdings-list">No holdings yet</p>
<script>
    async function openHolding(){
        const element = document.getElementById("open-holdings-list");
        const response = await fetch("/api/v1/holdings/opening", {
            method: "POST",
            headers: {
                "Content-Type" : "application/json",
            },
            body: JSON.stringify({
                account_id: 2,
                ticker: "AAPL",
                quantity: "2.25"
            })
        });
        const data = await response.json();
        if (response.ok == true) {
            element.textContent = data.position_id;
        } else {
            element.textContent = "Error: " + response.status + ". " + data.detail;
        }        
    }
    document.getElementById("open-holding").addEventListener("click", openHolding);
</script>
