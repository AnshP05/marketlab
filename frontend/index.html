<h1>Accounts</h1>
<button id="load-accounts" type="button">Load Accounts</button>
<p id="status">Accounts have not been loaded yet.</p>
<ul id="accounts-list"></ul>
<script>
    // Async bc it is a network request so it returns a promise that it will deliver smtjh
    async function loadAccounts() {
        const element = document.getElementById("status");
        element.textContent = "Loading";
        const response = await fetch("api/v1/accounts");
        const data = await response.json();
        data_string = JSON.stringify(data);
        let names = "";
        for (let i = 0; i < data.accounts.length; ++i){
            names += data.accounts[i].name + ", ";
        }
        element.textContent = names;
    }

    document.getElementById("load-accounts").addEventListener("click", loadAccounts)
</script>

<button id="open-holding">Open Holding</button>
<p id="open-holdings-list">No holdings yet</p>
<script>
    async function openHolding(){
        const element = document.getElementById("open-holdings-list");
        const response = await fetch("/api/v1/holdings/opening", {
            method: "POST",
            headers: {
                "Content-Type" : "application/json",
            },
            body: JSON.stringify({
                account_id: 1,
                ticker: "MSFT",
                quantity: "1.2"
            })
        });
        const data = await response.json();
        if (response.ok == true) {
            element.textContent = data.position_id;
        } else {
            element.textContent = "Error: " + response.status + ". " + data.detail;
        }        
    }
    document.getElementById("open-holding").addEventListener("click", openHolding);
</script>

<button id="get-opening-positions">Get Openings</button>
<p id="status-label">Not Loaded Yet</p>
<ul id="opening-positions-list"></ul>
<script>
    async function getOpeningPositions(){
        const statusLabel = document.getElementById("status-label");
        const response = await fetch("/api/v1/holdings/opening-positions");
        const data = await response.json();
        // Return early if there was an error
        if (response.ok == false) {
            statusLabel.textContent = "Error: " + response.status + ". " + data.detail;
            return;
        }
        const openingPositionsList = document.getElementById("opening-positions-list");
        // Clear the list to prevent duplicates piling up
        openingPositionsList.textContent = "";

        // Get the array from the data json object and loop over it appending it to the list
        const positions = data["opening-positions"];
        // Check if the array is empty and return early 
        if (positions.length === 0) {
            statusLabel.textContent = "No opening positions yet.";
            openingPositionsList.textContent = "";
            return;
        }
        statusLabel.textContent = "";
        for (const opening of positions) {
            const item = document.createElement("li");
            item.textContent = "Account: " + opening.account_name + " Symbol: "
                + opening.symbol + ": " + opening.shares + " shares";
            openingPositionsList.appendChild(item);
        }

    }
    document.getElementById("get-opening-positions").addEventListener("click", getOpeningPositions);
</script>
